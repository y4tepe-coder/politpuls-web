name: Web-Redaktion

# Taeglich 05:00 UTC. Das ist 07:00 CEST (Sommer) bzw. 06:00 CET (Winter) —
# also frueher Morgen, fertig deutlich VOR der 10-Uhr-Ausgabe auf politpuls.de.
# Der grosse Puffer ist Absicht: GitHub kann geplante Laeufe um bis zu ~1-2 h
# verzoegern, der Run selbst dauert ~5 min. Selbst mit Verspaetung ist die
# Ausgabe damit sicher vor 10:00 Berliner Zeit fertig. Die Zeit ist UTC, nicht
# Berliner Zeit — zum Verschieben hier den cron aendern. Plus manuell
# triggerbar fuer Tests und Nachgenerierung verpasster Tage.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      override_date:
        description: "Optional: YYYY-MM-DD (Berliner Datum) statt heute"
        required: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ inputs.override_date }}" ]; then
            echo "today=${{ inputs.override_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(TZ=Europe/Berlin date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Letzte Themen abrufen (Wiederholungs-Schutz)
        # Holt die letzten 10 Dossiers, damit Claude weiss, welche Themen schon
        # dran waren. Sonst kommt z.B. dreimal "Rente mit 70" in einer Woche —
        # und beim dritten Mal crasht der Upload an der slug-unique-Constraint
        # (so geschehen am 2026-06-10). Soft-Fail: ohne Liste laeuft es weiter.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          curl -sf "$SUPABASE_URL/rest/v1/dossiers?select=publish_date,slug,headline,topic_tags&order=publish_date.desc&limit=10" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o out/recent-topics.json \
            || echo "[]" > out/recent-topics.json
          echo "Letzte Themen: $(python3 -c "import json;print(', '.join(d['slug'] for d in json.load(open('out/recent-topics.json'))))" 2>/dev/null || echo 'keine')"

      - name: Generate dossier with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TODAY: ${{ steps.date.outputs.today }}
        run: |
          mkdir -p out
          PROMPT="$(python3 - <<'PY'
          from pathlib import Path
          import os
          tpl = Path("redaktion/web-prompt.md").read_text()
          recent = "[]"
          p = Path("out/recent-topics.json")
          if p.exists():
              recent = p.read_text().strip() or "[]"
          print(tpl.replace("{{TODAY}}", os.environ["TODAY"]).replace("{{RECENT_TOPICS}}", recent))
          PY
          )"
          # Claude beendet sich gelegentlich mit Exit != 0, obwohl es ein gueltiges
          # out/dossier.json geschrieben hat. Deshalb hier nicht hart failen — der
          # naechste Schritt prueft das Artefakt und entscheidet ueber Erfolg.
          echo "$PROMPT" | claude -p --dangerously-skip-permissions || \
            echo "Claude exited non-zero — pruefe Artefakt im naechsten Schritt."

      - name: Verify dossier file exists
        run: |
          if [ ! -s out/dossier.json ]; then
            echo "out/dossier.json fehlt oder ist leer — Generation gescheitert"
            exit 1
          fi
          python3 -m json.tool out/dossier.json > /dev/null

      - name: Enrich with real press images (og:image)
        # Füllt images[] aus den og:image der Quellen. Soft-Fail: scheitert das,
        # bleibt images leer und das Dossier wird trotzdem hochgeladen.
        run: node redaktion/enrich-images.mjs || echo "enrich-images übersprungen"

      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Erwartetes Datum an den Upload durchreichen — damit funktioniert
          # auch die Nachgenerierung verpasster Tage via override_date (vorher
          # prueften wir stur gegen "heute" und ein Backfill konnte nie klappen).
          TARGET_DATE: ${{ steps.date.outputs.today }}
        run: node redaktion/upload.mjs

      - name: Archive generated dossier on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-debug-${{ steps.date.outputs.today }}
          path: out/
          retention-days: 14
