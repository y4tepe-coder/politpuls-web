name: Web-Redaktion

# Taeglich 12:30 UTC. Das ist 14:30 CEST (Sommer) bzw. 13:30 CET (Winter) —
# also frueher Nachmittag, fertig deutlich VOR der 16-Uhr-Ausgabe in der App.
# Der Puffer ist Absicht: GitHub kann geplante Laeufe um bis zu ~1-2 h
# verzoegern, der Run selbst dauert ~5 min. Die Zeit ist UTC, nicht Berliner
# Zeit — zum Verschieben hier den cron aendern (z. B. "30 13 * * *" = 15:30
# CEST, dann aber knapper vor 16 Uhr). Plus manuell triggerbar fuer Tests und
# Nachgenerierung verpasster Tage.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      override_date:
        description: "Optional: YYYY-MM-DD (Berliner Datum) statt heute"
        required: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ inputs.override_date }}" ]; then
            echo "today=${{ inputs.override_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(TZ=Europe/Berlin date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dossier with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p out
          PROMPT="$(sed "s|{{TODAY}}|${{ steps.date.outputs.today }}|g" redaktion/web-prompt.md)"
          # Claude beendet sich gelegentlich mit Exit != 0, obwohl es ein gueltiges
          # out/dossier.json geschrieben hat. Deshalb hier nicht hart failen — der
          # naechste Schritt prueft das Artefakt und entscheidet ueber Erfolg.
          echo "$PROMPT" | claude -p --dangerously-skip-permissions || \
            echo "Claude exited non-zero — pruefe Artefakt im naechsten Schritt."

      - name: Verify dossier file exists
        run: |
          if [ ! -s out/dossier.json ]; then
            echo "out/dossier.json fehlt oder ist leer — Generation gescheitert"
            exit 1
          fi
          python3 -m json.tool out/dossier.json > /dev/null

      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node redaktion/upload.mjs

      - name: Archive generated dossier on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-debug-${{ steps.date.outputs.today }}
          path: out/
          retention-days: 14
